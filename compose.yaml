name: sapdesk
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
      - ./deploy/init-db.sql:/opt/init-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
  api:
    build:
      context: .
      target: backend
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - media:/app/private-media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/health',headers={'Host':os.environ['APP_DOMAIN'],'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
    logging: *logging
  worker:
    build:
      context: .
      target: backend
    command: ['python', 'manage.py', 'notify_worker']
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
  chat-worker:
    build:
      context: .
      target: chat-worker
    restart: unless-stopped
    init: true
    env_file: .env.production
    volumes:
      - codex-auth:/home/app/.codex
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', 'manage.py', 'chat_health']
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    logging: *logging
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      NGINX_ENVSUBST_FILTER: APP_DOMAIN
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/acme:/var/www/acme:ro
    depends_on:
      api:
        condition: service_healthy
    logging: *logging
volumes:
  database:
  media:
  codex-auth:
